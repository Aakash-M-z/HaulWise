services:
  - type: web
    name: haulwise-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn haulwise_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.13.5"
